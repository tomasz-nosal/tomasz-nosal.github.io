<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f3f0e8">
  <title>Flaga? Zgadnij!</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Nunito:wght@800;900&display=swap');
    :root{--ink:#18231d;--muted:#69756e;--cream:#f3f0e8;--card:#fffdf8;--green:#1f9d68;--green2:#167d55;--orange:#f6a53a;--red:#df584c;--line:#dedbd2;--shadow:0 22px 60px rgba(37,58,47,.13)}
    *{box-sizing:border-box} body{margin:0;min-height:100svh;background:radial-gradient(circle at 15% 15%,#fff9e7 0 11%,transparent 30%),radial-gradient(circle at 90% 85%,#d9eee1 0 12%,transparent 32%),var(--cream);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;display:grid;place-items:center;padding:24px}
    button,input{font:inherit} button{cursor:pointer}.app{width:min(100%,920px)}
    .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{font:900 clamp(22px,4vw,30px)/1 'Nunito',sans-serif;letter-spacing:-1px}.brand i{font-style:normal;color:var(--green)}
    .scorebar{display:flex;gap:8px}.pill{background:rgba(255,255,255,.7);border:1px solid rgba(24,35,29,.08);border-radius:999px;padding:9px 13px;font-size:13px;font-weight:700}.pill span{font-size:15px;margin-left:4px}
    .card{background:var(--card);border:1px solid rgba(24,35,29,.07);border-radius:28px;box-shadow:var(--shadow);overflow:hidden}.screen{padding:clamp(24px,6vw,58px)}
    h1{font:900 clamp(36px,7vw,66px)/.96 'Nunito',sans-serif;letter-spacing:-2.5px;margin:0 0 18px;max-width:700px}h1 em{font-style:normal;color:var(--green)}.lead{font-size:clamp(16px,2.3vw,20px);color:var(--muted);max-width:560px;line-height:1.55;margin:0 0 35px}
    .modes{display:grid;grid-template-columns:1fr 1fr;gap:14px}.mode{border:2px solid var(--line);background:#fff;border-radius:20px;text-align:left;padding:22px;transition:.2s;position:relative}.mode:hover,.mode:focus-visible{transform:translateY(-3px);border-color:var(--green);box-shadow:0 10px 24px rgba(31,157,104,.12)}.mode .icon{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#e5f5ec;font-size:22px;margin-bottom:16px}.mode b{display:block;font:800 19px 'Nunito';margin-bottom:5px}.mode small{color:var(--muted);font-size:14px}
    .game{display:none;padding:clamp(20px,4vw,40px)}.game-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.back{border:0;background:transparent;color:var(--muted);font-weight:700;padding:8px}.progress{height:8px;background:#e7e5df;border-radius:9px;overflow:hidden;flex:1;margin:0 20px}.progress i{display:block;height:100%;background:var(--green);width:0;transition:.35s}.counter{font-weight:700;font-size:14px;color:var(--muted)}
    .flag-wrap{height:clamp(210px,38vw,320px);display:flex;align-items:center;justify-content:center;background:#f2f4ef;border-radius:22px;padding:20px}.flag-wrap img{display:block;width:100%;height:100%;min-width:0;min-height:0;object-fit:contain;filter:drop-shadow(0 7px 8px rgba(0,0,0,.18))}.question{text-align:center;font:800 clamp(22px,4vw,30px) 'Nunito';margin:25px 0 18px}
    .answers{display:grid;grid-template-columns:1fr 1fr;gap:11px}.answer{min-height:58px;border:2px solid var(--line);background:#fff;border-radius:15px;font-weight:700;color:var(--ink);padding:12px;transition:.15s}.answer:hover:not(:disabled){border-color:var(--green);background:#f4fbf7}.answer.correct{border-color:var(--green);background:#ddf5e7;color:#126640}.answer.wrong{border-color:var(--red);background:#fde8e5;color:#a53830}.answer:disabled{cursor:default}
    .type-row{display:flex;gap:10px}.type-row input{min-width:0;flex:1;border:2px solid var(--line);border-radius:15px;padding:16px 18px;outline:0;font-size:16px}.type-row input:focus{border-color:var(--green)}.submit,.next,.again{border:0;border-radius:15px;background:var(--green);color:white;font-weight:800;padding:0 24px;box-shadow:0 7px 16px rgba(31,157,104,.2)}.submit:hover,.next:hover,.again:hover{background:var(--green2)}
    .feedback{min-height:36px;text-align:center;font-weight:700;padding-top:12px}.feedback.good{color:var(--green2)}.feedback.bad{color:var(--red)}.next{display:none;margin:4px auto 0;min-height:50px}
    .result{display:none;text-align:center;padding:clamp(35px,7vw,70px)}.result .medal{font-size:62px}.result h2{font:900 clamp(34px,6vw,56px) 'Nunito';margin:8px 0}.result p{color:var(--muted);font-size:18px}.result strong{color:var(--ink)}.again{min-height:54px;margin-top:15px;padding:0 30px}
    @media(max-width:580px){body{padding:12px}.top{margin:4px 4px 12px}.pill{padding:7px 9px}.pill:first-child{display:none}.card{border-radius:22px}.screen{padding:30px 22px}.modes,.answers{grid-template-columns:1fr}.mode{padding:17px}.mode .icon{float:left;margin:0 14px 0 0}.flag-wrap{height:220px;padding:12px}.type-row{flex-direction:column}.submit{min-height:52px}.game{padding:16px}.progress{margin:0 10px}}
  </style>
</head>
<body>
<main class="app">
  <header class="top"><div class="brand">Flaga? <i>Zgadnij!</i></div><div class="scorebar"><div class="pill">Najlepszy <span id="best">0</span></div><div class="pill">🔥 <span id="streakTop">0</span></div></div></header>
  <section class="card">
    <div class="screen" id="start"><h1>Ile flag świata <em>rozpoznasz?</em></h1><p class="lead">Sprawdź swoją wiedzę w szybkiej rundzie 10 pytań. Wybierz, jak chcesz grać.</p><div class="modes"><button class="mode" data-mode="choice"><span class="icon">🎯</span><b>Wybierz odpowiedź</b><small>Jedna z czterech odpowiedzi</small></button><button class="mode" data-mode="typing"><span class="icon">⌨️</span><b>Wpisz kraj</b><small>Bez podpowiedzi — trudniej!</small></button></div></div>
    <div class="game" id="game"><div class="game-head"><button class="back" id="back">← Menu</button><div class="progress"><i id="progress"></i></div><div class="counter"><span id="number">1</span>/10</div></div><div class="flag-wrap"><img id="flag" alt="Flaga do odgadnięcia"></div><div class="question">Jaki to kraj?</div><div id="answers" class="answers"></div><form id="typeForm" class="type-row"><input id="countryInput" autocomplete="off" placeholder="Wpisz nazwę kraju…"><button class="submit">Sprawdź</button></form><div class="feedback" id="feedback"></div><button class="next" id="next">Następna flaga →</button></div>
    <div class="result" id="result"><div class="medal" id="medal">🏆</div><h2 id="resultTitle">Świetny wynik!</h2><p>Zdobywasz <strong id="finalScore">0/10</strong><br><span id="resultText"></span></p><button class="again" id="again">Zagraj ponownie</button></div>
  </section>
</main>
<script>
const countries=[
['pl','Polska',['polska']],['de','Niemcy',['niemcy']],['fr','Francja',['francja']],['it','Włochy',['wlochy','włochy']],['es','Hiszpania',['hiszpania']],['pt','Portugalia',['portugalia']],['gb','Wielka Brytania',['wielka brytania','anglia','uk']],['ie','Irlandia',['irlandia']],['nl','Holandia',['holandia','niderlandy']],['be','Belgia',['belgia']],['ch','Szwajcaria',['szwajcaria']],['at','Austria',['austria']],['cz','Czechy',['czechy']],['sk','Słowacja',['slowacja','słowacja']],['ua','Ukraina',['ukraina']],['se','Szwecja',['szwecja']],['no','Norwegia',['norwegia']],['fi','Finlandia',['finlandia']],['dk','Dania',['dania']],['is','Islandia',['islandia']],['gr','Grecja',['grecja']],['hr','Chorwacja',['chorwacja']],['ro','Rumunia',['rumunia']],['hu','Węgry',['wegry','węgry']],['bg','Bułgaria',['bulgaria','bułgaria']],['lt','Litwa',['litwa']],['lv','Łotwa',['lotwa','łotwa']],['ee','Estonia',['estonia']],['us','Stany Zjednoczone',['stany zjednoczone','usa','stany']],['ca','Kanada',['kanada']],['mx','Meksyk',['meksyk']],['br','Brazylia',['brazylia']],['ar','Argentyna',['argentyna']],['cl','Chile',['chile']],['co','Kolumbia',['kolumbia']],['jp','Japonia',['japonia']],['cn','Chiny',['chiny']],['in','Indie',['indie']],['kr','Korea Południowa',['korea poludniowa','korea południowa']],['th','Tajlandia',['tajlandia']],['vn','Wietnam',['wietnam']],['id','Indonezja',['indonezja']],['au','Australia',['australia']],['nz','Nowa Zelandia',['nowa zelandia']],['eg','Egipt',['egipt']],['ma','Maroko',['maroko']],['za','Republika Południowej Afryki',['republika poludniowej afryki','republika południowej afryki','rpa']],['ke','Kenia',['kenia']],['tr','Turcja',['turcja']],['il','Izrael',['izrael']]
];
const $=s=>document.querySelector(s), start=$('#start'),game=$('#game'),result=$('#result'),answers=$('#answers'),form=$('#typeForm'),input=$('#countryInput');let mode,round,score,streak,current,locked,deck;
const norm=s=>s.toLocaleLowerCase('pl').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-ząćęłńóśźż ]/gi,'').trim().replace(/\s+/g,' ');
const shuffle=a=>[...a].sort(()=>Math.random()-.5);$('#best').textContent=localStorage.flagBest||0;
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>begin(b.dataset.mode));
function begin(m){mode=m;round=0;score=0;streak=0;deck=shuffle(countries).slice(0,10);start.style.display='none';result.style.display='none';game.style.display='block';nextQuestion()}
function nextQuestion(){locked=false;current=deck[round];$('#number').textContent=round+1;$('#progress').style.width=`${round*10}%`;$('#flag').src=`https://flagcdn.com/w640/${current[0]}.png`;$('#flag').alt=`Flaga — pytanie ${round+1}`;$('#feedback').textContent='';$('#feedback').className='feedback';$('#next').style.display='none';answers.innerHTML='';form.style.display=mode==='typing'?'flex':'none';input.value='';if(mode==='choice'){let opts=shuffle([current,...shuffle(countries.filter(c=>c!==current)).slice(0,3)]);opts.forEach(c=>{let b=document.createElement('button');b.className='answer';b.textContent=c[1];b.onclick=()=>check(c===current,b);answers.append(b)})}else setTimeout(()=>input.focus(),100)}
function check(ok,button){if(locked)return;locked=true;if(ok){score++;streak++;$('#feedback').textContent='Dobrze! Świetnie rozpoznana flaga ✨';$('#feedback').classList.add('good');if(button)button.classList.add('correct')}else{streak=0;$('#feedback').innerHTML=`Nie tym razem. To <b>${current[1]}</b>.`;$('#feedback').classList.add('bad');if(button)button.classList.add('wrong');[...answers.children].find(b=>b.textContent===current[1])?.classList.add('correct')}$('#streakTop').textContent=streak;[...answers.children].forEach(b=>b.disabled=true);input.readOnly=true;$('#next').style.display='block';$('#progress').style.width=`${(round+1)*10}%`}
form.onsubmit=e=>{e.preventDefault();if(locked){advance();return}if(input.value.trim())check(current[2].map(norm).includes(norm(input.value)))};
function advance(){input.readOnly=false;round++;round<10?nextQuestion():finish()}
$('#next').onclick=advance;
function finish(){game.style.display='none';result.style.display='block';let best=Math.max(score,+(localStorage.flagBest||0));localStorage.flagBest=best;$('#best').textContent=best;$('#finalScore').textContent=`${score}/10`;$('#medal').textContent=score>=9?'🏆':score>=6?'🥈':'🌍';$('#resultTitle').textContent=score>=9?'Mistrz flag!':score>=6?'Bardzo dobry wynik!':'Świat czeka!';$('#resultText').textContent=score>=9?'Naprawdę znasz świat.':score>=6?'Jeszcze chwila i będzie komplet.':'Każda runda to krok do przodu.'}
$('#again').onclick=()=>begin(mode);$('#back').onclick=()=>{game.style.display='none';result.style.display='none';start.style.display='block';input.readOnly=false};
</script>
</body>
</html>
